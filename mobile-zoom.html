<!--
  作者：马宇乾
  建立时间：2026-11-16 14:40
  使用模型：Trae
  功能名称及简介：移动端图片查看器 —— 双指捏合缩放、单指拖动、双击切换 1x/2x，缩放以双指中点为锚点不跳变
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>移动端图片查看器 · 双指缩放</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a1a;
    color: #fff;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  /* 顶部标题栏 */
  .myq_header {
    padding: 16px;
    text-align: center;
    border-bottom: 1px solid #333;
  }
  .myq_header h1 { font-size: 18px; font-weight: 600; }
  .myq_header p { font-size: 12px; color: #999; margin-top: 4px; }
  /* 图片查看容器：核心约束 */
  .myq_zoom_box {
    position: relative;
    flex: 1;
    width: 100%;
    overflow: hidden;          /* 图片超出容器部分隐藏 */
    touch-action: none;        /* 禁用浏览器默认手势（滚动、双击缩放），交给 JS 处理 */
    user-select: none;         /* 禁止选中文字，避免拖动时选中图片 */
    -webkit-user-select: none;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* 图片本身：transform 由 JS 统一驱动 */
  .myq_zoom_img {
    max-width: 100%;
    max-height: 100%;
    display: block;
    /* 拖拽跟手时必须去掉 transition，否则有延迟感；双击缩放时 JS 临时加上 0.25s */
    transition: transform 0s ease;
    transform-origin: 0 0;     /* 关键：变换原点固定在左上角，配合 translate 公式保证缩放锚点不跳 */
    will-change: transform;
  }
  /* 操作提示浮层 */
  .myq_tip {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0, 0, 0, 0.78);
    color: #fff;
    padding: 20px 28px;
    border-radius: 12px;
    font-size: 15px;
    text-align: center;
    z-index: 999;
    line-height: 1.6;
    max-width: 80%;
  }
  .myq_tip .myq_tip_title {
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 8px;
    color: #ffd54f;
  }
  .myq_tip .myq_tip_close {
    display: inline-block;
    margin-top: 14px;
    padding: 6px 20px;
    background: #4caf50;
    border-radius: 20px;
    font-size: 14px;
    cursor: pointer;
  }
  /* 底部状态栏 */
  .myq_status {
    padding: 10px 16px;
    text-align: center;
    font-size: 13px;
    color: #aaa;
    border-top: 1px solid #333;
  }
  /* 返回首页链接 */
  .myq_home_link {
    position: fixed;
    top: 12px;
    left: 12px;
    color: #4caf50;
    text-decoration: none;
    font-size: 14px;
    z-index: 1000;
  }
</style>
</head>
<body>

<a href="./index.html" class="myq_home_link">← 返回首页</a>

<header class="myq_header">
  <h1>移动端图片查看器</h1>
  <p>双指捏合缩放 · 单指拖动 · 双击切换 1x/2x</p>
</header>

<!-- 图片容器：所有触摸交互绑定在此 -->
<div class="myq_zoom_box" id="myqZoomBox">
  <img class="myq_zoom_img" id="myqZoomImg" src="img/myq_lionhead_1.jpg" alt="红烧狮子头">
</div>

<!-- 底部状态：实时显示当前缩放倍数 -->
<div class="myq_status" id="myqStatus">缩放：1.00x</div>

<!-- 操作提示浮层：页面打开时显示 -->
<div class="myq_tip" id="myqTip">
  <div class="myq_tip_title">双指缩放请用手机打开</div>
  <div>双指捏合：缩放（1x ~ 4x）</div>
  <div>单指拖动：放大后可移动图片</div>
  <div>双击：在 1x 与 2x 之间切换</div>
  <span class="myq_tip_close" id="myqTipClose">我知道了</span>
</div>

<script>
/* 作者：马宇乾 | 建立时间：2026-11-16 14:40 | 使用模型：Trae
   功能：移动端图片查看器 —— 捏合缩放 / 单指拖动 / 双击切换，缩放以双指中点为锚点保证不跳 */

(function () {
  "use strict";

  // ===== 1. 获取 DOM 元素 =====
  var myq_box = document.getElementById("myqZoomBox");   // 容器
  var myq_img = document.getElementById("myqZoomImg");   // 图片
  var myq_status = document.getElementById("myqStatus"); // 状态栏
  var myq_tip = document.getElementById("myqTip");       // 提示浮层
  var myq_tip_close = document.getElementById("myqTipClose");

  // ===== 2. 状态对象：单一数据源，由 myqRender() 统一输出 transform =====
  // 这是"缩放不跳"的基础：所有操作只改 state，不直接改 DOM 样式
  var myq_state = {
    scale: 1,          // 当前缩放倍数，范围 1 ~ 4
    translateX: 0,     // X 方向位移（px）
    translateY: 0,     // Y 方向位移（px）
  };

  // ===== 3. 手势过程中的临时变量 =====
  var myq_isTwoFinger = false;     // 是否双指
  var myq_initialDist = 0;         // 双指初始距离
  var myq_initialScale = 1;        // 双指开始时的缩放倍数
  var myq_initialMid = { x: 0, y: 0 }; // 双指初始中点（相对容器）
  var myq_initialTranslate = { x: 0, y: 0 }; // 双指开始时的位移
  var myq_lastTouch = null;        // 单指拖动时上一次触点位置
  var myq_lastTapTime = 0;         // 上一次点击时间（用于双击判定）
  var myq_lastTapPos = { x: 0, y: 0 }; // 上一次点击位置
  var myq_isAnimating = false;     // 是否正在播放双击过渡动画（冷却锁）

  // ===== 4. 统一渲染函数：把 state 转换成 transform =====
  // 变换原点是左上角 (0,0)，所以先 translate 再 scale 时，
  // 图片上某点的屏幕坐标 = translateX + 点原图坐标 * scale
  function myqRender() {
    myq_img.style.transform =
      "translate(" + myq_state.translateX + "px, " + myq_state.translateY + "px) scale(" + myq_state.scale + ")";
    myq_status.textContent = "缩放：" + myq_state.scale.toFixed(2) + "x";
  }

  // ===== 5. 计算两指距离 =====
  function myqGetDist(t1, t2) {
    var myq_dx = t1.clientX - t2.clientX;
    var myq_dy = t1.clientY - t2.clientY;
    return Math.sqrt(myq_dx * myq_dx + myq_dy * myq_dy);
  }

  // ===== 6. 计算两指中点（相对容器）=====
  function myqGetMid(t1, t2) {
    var myq_rect = myq_box.getBoundingClientRect();
    return {
      x: (t1.clientX + t2.clientX) / 2 - myq_rect.left,
      y: (t1.clientY + t2.clientY) / 2 - myq_rect.top,
    };
  }

  // ===== 7. 边界约束：保证放大后图片不会被拖出可视区 =====
  function myqClamp() {
    // 图片实际显示尺寸 = 原始尺寸 * scale
    var myq_imgW = myq_img.offsetWidth * myq_state.scale;
    var myq_imgH = myq_img.offsetHeight * myq_state.scale;
    var myq_boxW = myq_box.clientWidth;
    var myq_boxH = myq_box.clientHeight;

    // 当图片比容器大时，translate 的范围要让图片边缘不进入容器内部留黑边
    // 当图片比容器小时，translate 归 0（居中）
    if (myq_imgW <= myq_boxW) {
      myq_state.translateX = 0;
    } else {
      var myq_maxX = myq_imgW - myq_boxW;
      // translateX 为负表示图片向左移，范围 [-maxX, 0]
      myq_state.translateX = Math.max(-myq_maxX, Math.min(0, myq_state.translateX));
    }
    if (myq_imgH <= myq_boxH) {
      myq_state.translateY = 0;
    } else {
      var myq_maxY = myq_imgH - myq_boxH;
      myq_state.translateY = Math.max(-myq_maxY, Math.min(0, myq_state.translateY));
    }
  }

  // ===== 8. touchstart：记录手势初始状态 =====
  myq_box.addEventListener("touchstart", function (e) {
    e.preventDefault();
    myq_img.style.transition = "transform 0s"; // 手势操作时关闭过渡，保证跟手

    if (e.touches.length === 2) {
      // —— 双指：记录初始距离、初始缩放、初始中点、初始位移 ——
      myq_isTwoFinger = true;
      myq_initialDist = myqGetDist(e.touches[0], e.touches[1]);
      myq_initialScale = myq_state.scale;
      myq_initialMid = myqGetMid(e.touches[0], e.touches[1]);
      myq_initialTranslate = { x: myq_state.translateX, y: myq_state.translateY };
    } else if (e.touches.length === 1) {
      // —— 单指：记录起始触点，用于拖动 ——
      myq_isTwoFinger = false;
      myq_lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
  }, { passive: false });

  // ===== 9. touchmove：根据手指数量执行缩放或拖动 =====
  myq_box.addEventListener("touchmove", function (e) {
    e.preventDefault();

    if (e.touches.length === 2 && myq_isTwoFinger) {
      // —— 双指捏合缩放 ——
      var myq_curDist = myqGetDist(e.touches[0], e.touches[1]);
      if (myq_initialDist === 0) return; // 防止除零

      // 新缩放倍数 = 初始缩放 * (当前距离 / 初始距离)
      var myq_newScale = myq_initialScale * (myq_curDist / myq_initialDist);
      // 限制在 1 ~ 4 倍之间
      myq_newScale = Math.max(1, Math.min(4, myq_newScale));

      // —— 关键：以双指中点为锚点计算位移，保证"缩放不跳" ——
      // 原理：中点在图片坐标系下的位置必须保持不变。
      //   屏幕坐标 = translate + 图片坐标 * scale
      //   图片坐标 = (中点屏幕坐标 - 初始translate) / 初始scale
      //   新translate = 中点屏幕坐标 - 图片坐标 * 新scale
      // 化简后：新translate = mid - (mid - 初始translate) * (新scale / 初始scale)
      var myq_ratio = myq_newScale / myq_initialScale;
      myq_state.translateX = myq_initialMid.x - (myq_initialMid.x - myq_initialTranslate.x) * myq_ratio;
      myq_state.translateY = myq_initialMid.y - (myq_initialMid.y - myq_initialTranslate.y) * myq_ratio;

      myq_state.scale = myq_newScale;
      myqClamp();   // 缩放后做边界约束
      myqRender();  // 统一渲染

    } else if (e.touches.length === 1 && !myq_isTwoFinger && myq_state.scale > 1) {
      // —— 单指拖动：仅在放大状态下允许 ——
      var myq_dx = e.touches[0].clientX - myq_lastTouch.x;
      var myq_dy = e.touches[0].clientY - myq_lastTouch.y;
      myq_state.translateX += myq_dx;
      myq_state.translateY += myq_dy;
      myq_lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      myqClamp();   // 拖动时实时约束，防止图片飞出
      myqRender();
    }
  }, { passive: false });

  // ===== 10. touchend：处理双击切换 =====
  myq_box.addEventListener("touchend", function (e) {
    // 手指全部离开后才判定双击
    if (e.touches.length > 0) return;

    var myq_now = Date.now();
    // 取 changedTouches 中最后一个离开的触点位置
    var myq_touch = e.changedTouches[e.changedTouches.length - 1];
    var myq_pos = { x: myq_touch.clientX, y: myq_touch.clientY };

    // 双击判定：两次点击间隔 < 300ms 且位置距离 < 30px
    if (myq_now - myq_lastTapTime < 300 &&
        Math.abs(myq_pos.x - myq_lastTapPos.x) < 30 &&
        Math.abs(myq_pos.y - myq_lastTapPos.y) < 30) {

      if (!myq_isAnimating) {
        myq_isAnimating = true;
        // 双击在 1x 与 2x 之间切换
        if (myq_state.scale > 1) {
          myq_state.scale = 1;
          myq_state.translateX = 0;
          myq_state.translateY = 0;
        } else {
          // 放大到 2x，并以点击点为锚点
          var myq_rect = myq_box.getBoundingClientRect();
          var myq_px = myq_pos.x - myq_rect.left;
          var myq_py = myq_pos.y - myq_rect.top;
          myq_state.scale = 2;
          // 同样用锚点公式，保证点击点不跳
          myq_state.translateX = myq_px - myq_px * 2;
          myq_state.translateY = myq_py - myq_py * 2;
          myqClamp();
        }
        // 双击时开启 0.25s 过渡动画
        myq_img.style.transition = "transform 0.25s ease";
        myqRender();
        // 动画结束后解锁
        setTimeout(function () { myq_isAnimating = false; }, 280);
      }
      myq_lastTapTime = 0; // 重置，避免三连击误触
    } else {
      myq_lastTapTime = myq_now;
      myq_lastTapPos = myq_pos;
    }

    myq_isTwoFinger = false;
  }, { passive: false });

  // ===== 11. 关闭提示浮层 =====
  myq_tip_close.addEventListener("click", function () {
    myq_tip.style.display = "none";
  });
  myq_tip.addEventListener("click", function (e) {
    if (e.target === myq_tip) myq_tip.style.display = "none";
  });

  // ===== 12. 初始渲染 =====
  myqRender();

})();
</script>
</body>
</html>
